- name: configuring shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: install maven
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql

  - name: create roboshop system user
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      system: true
      shell: /sbin/nologin
      home: /app
  
  - name: remove app directory if exists
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create app directory
    ansible.builtin.file:
      state: directory
      path: /app

  - name: Delete shippping files
    ansible.builtin.file:
      path: /tmp/shippping.zip
      state: absent

  - name: download shippping application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shippping-v3.zip
      dest: /tmp/shippping.zip
  
  - name: extract shippping application
    ansible.builtin.unarchive:
      src: /tmp/shippping.zip
      dest: /app
      remote_src: yes
  
  - name: install dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: move jar files
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
    args:
      chdir: /app

  - name: copy shipping service
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service
  
  - name: import shipping data into mysql
    community.mysql.mysql_db:
      state: import
      name: all
      login_hosts: mysql.manibhargavi2225.online
      login_user: root
      login_password: RoboShop@1
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql
    - /app/db/master-data.sql
     
    